<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <!-- Kunai drawn directly along its diagonal — no rotation transform, so
       nothing can clip outside the viewBox no matter the SVG renderer. -->
  <!-- blade -->
  <path d="M7 5 L15 11 L11 21 L3 15 Z" fill="#dfe6ea" stroke="#0b0b0d" stroke-width="1.2"/>
  <path d="M7 5 L12 9 L9 17 L5 13 Z" fill="#f4f7f8" opacity="0.7"/>
  <!-- guard -->
  <rect x="9.5" y="13" width="10" height="3" rx="1.2" fill="#1a1a1e" stroke="#0b0b0d" stroke-width="0.6" transform="rotate(37 14.5 14.5)"/>
  <!-- handle -->
  <rect x="13" y="16" width="4.4" height="12" rx="1.6" fill="#2a2a30" stroke="#0b0b0d" stroke-width="0.6" transform="rotate(37 15.2 22)"/>
  <!-- red bindings -->
  <rect x="14.6" y="18.5" width="4.4" height="1.7" fill="#e63946" transform="rotate(37 16.8 19.35)"/>
  <rect x="17.3" y="21.7" width="4.4" height="1.7" fill="#e63946" transform="rotate(37 19.5 22.55)"/>
  <!-- ring -->
  <circle cx="23.5" cy="27" r="2.1" fill="none" stroke="#2a2a30" stroke-width="1.3"/>
</svg>
